name: API Security Audit (Newman)

on:
  repository_dispatch:
    types: [newman_scan_event]

jobs:
  newman-audit:
    runs-on: self-hosted 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # On retire l'installation NPM car elle demande des droits SUDO que le runner n'a pas
      - name: Execute Security Collection
        run: |
          newman run vAPI.postman_collection.json \
          --reporters cli,htmlextra \
          --reporter-htmlextra-export report.html \
          --env-var "host=192.168.159.131:8000" \
          --env-var "baseUrl=http://192.168.159.131:8000" \
          --timeout-request 10000 \
          --ignore-redirects
        continue-on-error: true 

      - name: Upload Scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-security-report
          path: report.html
          retention-days: 5
