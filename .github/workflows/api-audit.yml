name: API Security Audit (Newman)

# Déclenché par ton script FastAPI (Python)
on:
  repository_dispatch:
    types: [newman_scan_event]

jobs:
  newman-audit:
    # --- TRÈS IMPORTANT : Dit à GitHub d'utiliser ta KALI ---
    runs-on: self-hosted 

    steps:
      # 1. Récupère le fichier vAPI.postman_collection.json depuis ton dépôt
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Exécute le scan Newman directement depuis ta Kali
      # On utilise l'IP locale de ton Ubuntu car la Kali est dans le même réseau
      - name: Execute Security Collection
        run: |
          newman run vAPI.postman_collection.json \
          --reporters cli,htmlextra \
          --reporter-htmlextra-export report.html \
          --env-var "host=192.168.159.131:8000" \
          --env-var "baseUrl=http://192.168.159.131:8000" \
          --timeout-request 10000 \
          --ignore-redirects
        continue-on-error: true # Indispensable pour générer le rapport même si des failles sont trouvées

      # 3. Envoie le rapport HTML final sur GitHub (Ton résultat de PFE)
      - name: Upload Scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-security-report
          path: report.html
          retention-days: 5
