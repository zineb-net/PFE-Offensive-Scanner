name: API Offensive Audit to DefectDojo

on:
  repository_dispatch:
    types: [newman_scan_event]

jobs:
  api-audit:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Exécution du scan Newman sur ta Kali
      - name: Execute Newman Scan
        run: |
          newman run vAPI.postman_collection.json \
          --reporters cli,htmlextra,json \
          --reporter-htmlextra-export report.html \
          --reporter-json-export report.json \
          --env-var "host=192.168.159.131:8000" \
          --env-var "baseUrl=http://192.168.159.131:8000" \
          --timeout-request 10000
        continue-on-error: true

      # 2. Envoi vers DefectDojo avec le type "Generic Findings Import"
      - name: Upload to DefectDojo
        run: |
          curl -X POST "${{ secrets.DOJO_URL }}/api/v2/import-scan/" \
          -H "Authorization: Token ${{ secrets.DOJO_TOKEN }}" \
          -F "active=true" \
          -F "verified=true" \
          -F "scan_type=Generic Findings Import" \
          -F "product_name=Plateforme Offensive PFE" \
          -F "engagement_name=Audit API Automatisé" \
          -F "file=@report.json"

      # 3. Archive du rapport HTML pour tes preuves de PFE
      - name: Archive HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-security-report
          path: report.html
