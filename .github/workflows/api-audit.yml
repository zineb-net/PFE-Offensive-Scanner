name: API Offensive Audit

on:
  repository_dispatch:
    types: [newman_scan_event]

jobs:
  api-audit:
    # Assure-toi que ton runner Kali est bien lancé avec ./run.sh
    runs-on: self-hosted

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Exécution du scan Newman
        run: |
          # On installe newman s'il n'est pas présent (optionnel si déjà sur Kali)
          # npm install -g newman
          
          # On lance le scan sur l'URL de collection envoyée par l'interface
          # On génère un rapport JSON propre pour l'IA
          newman run "${{ github.event.client_payload.collection }}" \
          --reporters cli,json \
          --reporter-json-export api_report.json \
          --timeout-request 10000
        # On met true pour que le workflow continue même si Newman trouve des vulnérabilités
        continue-on-error: true

      - name: 3. Archivage du rapport pour l'IA (Llama)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-security-report
          # C'est ce fichier que ton script Python va télécharger
          path: api_report.json
          retention-days: 1
