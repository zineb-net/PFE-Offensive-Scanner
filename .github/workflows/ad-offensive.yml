name: "AD Offensive Platform - Choix du Scan"

on:
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Stratégie de scan'
        required: true
        default: 'anonyme'
        type: choice
        options:
          - anonyme
          - authentifie

jobs:
  offensive_task:
    runs-on: [self-hosted, kali]
    steps:
      - name: 1. Vérification réseau
        run: ping -c 2 192.168.159.100

      # --- SCÉNARIO A : SCAN ANONYME (Nmap XML) ---
      - name: Lancer Scan Anonyme
        if: ${{ github.event.inputs.scan_type == 'anonyme' }}
        run: |
          nmap -Pn -p 445 \
            --script smb-protocols,smb2-security-mode,smb-os-discovery \
            192.168.159.100 -oX ad_report.xml

     # --- SCÉNARIO B : SCAN AUTHENTIFIÉ (VERSION BASH REDIRECTION) ---
      - name: Lancer Scan Authentifié Profond
        if: ${{ github.event.inputs.scan_type == 'authentifie' }}
        env:
          USER: "user.std"
          PASS: ${{ secrets.AD_PASSWORD }}
          DOMAIN: "PFE"
        run: |
          # On demande à enum4linux-ng d'afficher le résultat en JSON (-oJ) 
          # MAIS on ne lui donne pas de fichier, on utilise '>' pour capturer la sortie.
          # On ajoute '|| true' pour que le workflow ne s'arrête pas si l'outil trouve des erreurs mineures.
          enum4linux-ng -u "$USER" -p "$PASS" -w "$DOMAIN" -A -oJ 192.168.159.100 > ad_report.json || true

      # --- ÉTAPE COMMUNE : EXPORT DU RAPPORT ---
      - name: Archivage du rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-${{ github.event.inputs.scan_type }}
          path: ad_report.*
