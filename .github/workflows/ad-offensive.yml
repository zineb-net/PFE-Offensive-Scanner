name: "AD Offensive Module - Advanced Vulnerability Scan"

on:
  workflow_dispatch:
  repository_dispatch:
    types: [ad_scan_event]

jobs:
  reconnaissance:
    runs-on: [self-hosted, kali]
    
    steps:
      - name: Vérifier la connectivité
        run: ping -c 3 192.168.159.100

      - name: Scan Profond (Enumération & Sécurité SMB)
        run: |
          # smb-protocols : vérifie si SMBv1 (dangereux) est actif
          # smb-security-mode : vérifie si la signature SMB est obligatoire
          # smb-enum-shares : liste les dossiers partagés accessibles
          # smb2-security-mode : vérifie la sécurité sur les versions récentes
          nmap -Pn -p 445 --script smb-protocols,smb-security-mode,smb-enum-shares,smb2-security-mode 192.168.159.100 -oX ad_report.xml

      - name: Upload du rapport détaillé
        uses: actions/upload-artifact@v4
        with:
          name: Rapport-AD-Advanced
          path: ad_report.xml
