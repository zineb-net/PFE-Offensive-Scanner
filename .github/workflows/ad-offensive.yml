name: "AD Offensive Platform - Choix du Scan"

on:
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Stratégie de scan à lancer'
        required: true
        default: 'anonyme'
        type: choice
        options:
          - anonyme
          - authentifie
      target_ip:
        description: 'IP cible (ex: 192.168.159.100)'
        required: true
        default: '192.168.159.100'
      # Ces champs sont remplis automatiquement par ton script Python lors du Chaining
      username:
        description: 'Nom d utilisateur (pour scan authentifié)'
        required: false
        default: ''
      password:
        description: 'Mot de passe (pour scan authentifié)'
        required: false
        default: ''

jobs:
  offensive_task:
    runs-on: [self-hosted, kali]
    steps:
      - name: 1. Vérification réseau
        run: ping -c 2 ${{ github.event.inputs.target_ip }}

      # --- SCÉNARIO A : SCAN ANONYME ---
      - name: Lancer Scan Anonyme (Enum4linux-ng)
        if: ${{ github.event.inputs.scan_type == 'anonyme' }}
        run: |
          echo "🚀 Lancement du scan anonyme sur ${{ github.event.inputs.target_ip }}"
          # On utilise -j pour forcer le format JSON pour l'IA
          enum4linux-ng -A ${{ github.event.inputs.target_ip }} -j ad_report.json || echo "{\"status\": \"error\"}" > ad_report.json

      # --- SCÉNARIO B : SCAN AUTHENTIFIÉ ---
      - name: Lancer Scan Authentifié (Enum4linux-ng)
        if: ${{ github.event.inputs.scan_type == 'authentifie' }}
        run: |
         - name: Lancer Scan Authentifié (Enum4linux-ng)
        if: ${{ github.event.inputs.scan_type == 'authentifie' }}
        run: |
          USER='${{ github.event.inputs.username }}'
          PASS='${{ github.event.inputs.password }}'
          IP='${{ github.event.inputs.target_ip }}'
          DOMAIN='PFE'

          # On force l'utilisateur support.it si vide
          if [ -z "$USER" ]; then USER="support.it"; fi

          echo "DEBUG: Tentative avec $USER / $PASS"

          # On utilise -v (verbose) pour voir l'erreur dans la console
          enum4linux-ng -u "$USER" -p "$PASS" -w "$DOMAIN" -A "$IP" -j ad_report.json -v

          # TRÈS IMPORTANT : Affiche le contenu pour que tu puisses le lire dans GitHub Actions
          echo "--- CONTENU DU RAPPORT ---"
          cat ad_report.json
