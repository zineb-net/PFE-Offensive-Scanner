name: "AD Offensive - Stratégie de Scan Séparée"

on:
  workflow_dispatch:

jobs:
  # --- JOB 1 : SCAN SANS AUTHENTIFICATION (BLACK BOX) ---
  scan_anonyme:
    name: "Phase 1: Reconnaissance Anonyme"
    runs-on: [self-hosted, kali]
    steps:
      - name: Scan SMB Anonyme
        run: |
          # On teste juste si le serveur est bavard sans mot de passe
          nmap -Pn -p 445 \
            --script smb-protocols,smb2-security-mode,smb-os-discovery \
            192.168.159.100 -oX rapport_anonyme.xml

      - name: Upload Rapport Anonyme
        uses: actions/upload-artifact@v4
        with:
          name: Rapport-AD-Anonyme
          path: rapport_anonyme.xml

  # --- JOB 2 : SCAN AVEC AUTHENTIFICATION (WHITE BOX) ---
  scan_authentifie:
    name: "Phase 2: Énumération avec Identifiants"
    needs: scan_anonyme # Se lance après le premier job
    runs-on: [self-hosted, kali]
    steps:
      - name: Énumération AD avec user.std
        env:
          USER: ${{ secrets.AD_USER }}
          PASS: ${{ secrets.AD_PASSWORD }}
        run: |
          # Ici on force l'extraction des utilisateurs et des partages
          # Note: On utilise des guillemets simples pour protéger le mot de passe
          nmap -Pn -p 445 \
            --script smb-enum-users,smb-enum-shares \
            --script-args "smbuser='${USER}',smbpass='${PASS}'" \
            192.168.159.100 -oX rapport_authentifie.xml

      - name: Upload Rapport Authentifié
        uses: actions/upload-artifact@v4
        with:
          name: Rapport-AD-Authentifie
          path: rapport_authentifie.xml
