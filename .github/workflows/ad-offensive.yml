name: "AD Offensive Platform - Choix du Scan"

on:
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Stratégie de scan à lancer'
        required: true
        default: 'anonyme'
        type: choice
        options:
          - anonyme
          - authentifie
      target_ip:
        description: 'IP cible (ex: 192.168.159.100)'
        required: true
        default: '192.168.159.100'
      username:
        description: 'Nom d utilisateur (laisser vide pour anonyme)'
        required: false
        default: ''
      password:
        description: 'Mot de passe (laisser vide pour anonyme)'
        required: false
        default: ''

jobs:
  offensive_task:
    runs-on: [self-hosted, kali]
    steps:
      - name: 1. Vérification réseau
        run: ping -c 2 ${{ github.event.inputs.target_ip }}

      # --- SCÉNARIO : EXÉCUTION DU SCAN ---
      - name: Lancer le Scan Enum4linux-ng
        run: |
          IP='${{ github.event.inputs.target_ip }}'
          USER='${{ github.event.inputs.username }}'
          PASS='${{ github.event.inputs.password }}'
          
          if [ -z "$USER" ]; then
            echo "🚀 Lancement d'un scan ANONYME sur $IP"
            # C'est cette commande qui génère ton rapport (sans -u ni -p)
            enum4linux-ng -A "$IP" -j ad_report.json || true
          else
            echo "🔥 Lancement d'un scan AUTHENTIFIÉ pour $USER"
            enum4linux-ng -u "$USER" -p "$PASS" -A "$IP" -j ad_report.json || true
          fi

      - name: Archivage du rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-ad
          path: ad_report.json
