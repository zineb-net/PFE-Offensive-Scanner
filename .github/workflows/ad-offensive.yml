name: "AD Offensive Platform - Choix du Scan"

on:
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Stratégie de scan'
        required: true
        default: 'anonyme'
        type: choice
        options:
          - anonyme
          - authentifie
      target_ip:
        description: 'IP cible'
        required: true
        default: '192.168.159.100'
      username:
        description: 'Utilisateur pour scan authentifié'
        required: false
        default: ''
      password:
        description: 'Mot de passe pour scan authentifié'
        required: false
        default: ''

jobs:
  offensive_task:
    runs-on: [self-hosted, kali]
    steps:
      - name: 1. Vérification réseau
        run: ping -c 2 ${{ github.event.inputs.target_ip }}

      # --- SCÉNARIO A : SCAN ANONYME ---
      - name: Lancer Scan Anonyme
        if: ${{ github.event.inputs.scan_type == 'anonyme' }}
        run: |
          echo "🚀 Scan Anonyme en cours..."
          enum4linux-ng -A ${{ github.event.inputs.target_ip }} -j ad_report.json || true

      # --- SCÉNARIO B : SCAN AUTHENTIFIÉ (CHAINING) ---
      - name: Lancer Scan Authentifié
        if: ${{ github.event.inputs.scan_type == 'authentifie' }}
        run: |
          # Récupération des inputs envoyés par ton script Python
          USER="${{ github.event.inputs.username }}"
          if [ -z "$USER" ]; then USER="support.it"; fi
          
          PASS='${{ github.event.inputs.password }}'
          
          echo "🔥 Connexion avec l'utilisateur: $USER"
          
          # Utilisation de enum4linux-ng en mode authentifié avec sortie JSON
          enum4linux-ng -u "$USER" -p "$PASS" -w "PFE" -A ${{ github.event.inputs.target_ip }} -j ad_report.json || echo "{\"error\": \"failed\"}" > ad_report.json

      - name: Archivage du rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-ad
          path: ad_report.json
