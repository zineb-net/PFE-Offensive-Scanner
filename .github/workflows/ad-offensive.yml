name: "AD Offensive Platform - Choix du Scan"

on:
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Stratégie de scan à lancer'
        required: true
        default: 'anonyme'
        type: choice
        options:
          - anonyme
          - authentifie
      target_ip:
        description: 'IP cible (ex: 192.168.159.100)'
        required: true
        default: '192.168.159.100'

jobs:
  offensive_task:
    runs-on: [self-hosted, kali]
    steps:
      - name: 1. Vérification réseau
        run: ping -c 2 ${{ github.event.inputs.target_ip }}

      # --- SCÉNARIO A : SCAN ANONYME (Nmap NSE avancés) ---
      - name: Lancer Scan Anonyme (Nmap NSE)
        if: ${{ github.event.inputs.scan_type == 'anonyme' }}
        run: |
          # Utilisation de scripts NSE pour l'énumération profonde
          nmap -Pn -p 445,139,389 \
            --script smb-protocols,smb2-security-mode,smb-os-discovery,smb-enum-shares,ldap-rootdse \
            ${{ github.event.inputs.target_ip }} -oX ad_report.xml

      # --- SCÉNARIO B : SCAN AUTHENTIFIÉ ---
      - name: Lancer Scan Authentifié (Enum4linux-ng)
        if: ${{ github.event.inputs.scan_type == 'authentifie' }}
        env:
          USER: "user.std"
          PASS: ${{ secrets.AD_PASSWORD }}
          DOMAIN: "PFE"
        run: |
          enum4linux-ng -u "$USER" -p "$PASS" -w "$DOMAIN" -A ${{ github.event.inputs.target_ip }} > ad_report.json || true

      - name: Archivage du rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-${{ github.event.inputs.scan_type }}
          path: ad_report.*
