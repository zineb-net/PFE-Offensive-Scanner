name: "AD Offensive Module - Authenticated Enum"

on:
  workflow_dispatch:

jobs:
  reconnaissance:
    runs-on: [self-hosted, kali]
    
    steps:
      - name: 1. Vérification réseau
        run: ping -c 3 192.168.159.100

      - name: 2. Énumération Authentifiée (Users & Shares)
        env:
          USER: ${{ secrets.AD_USER }}
          PASS: ${{ secrets.AD_PASSWORD }}
        run: |
          # Utilisation des identifiants pour débloquer les infos AD
          # smb-enum-users : Liste tous les utilisateurs du domaine
          # smb-enum-shares : Liste tous les dossiers partagés
          # smb-os-discovery : Récupère le nom DNS complet du domaine
          
          nmap -Pn -p 445 \
            --script smb-enum-users,smb-enum-shares,smb-os-discovery \
            --script-args smbuser=$USER,smbpass=$PASS \
            192.168.159.100 -oX ad_report.xml

      - name: 3. Upload du rapport complet
        uses: actions/upload-artifact@v4
        with:
          name: Rapport-AD-Authentifie
          path: ad_report.xml
