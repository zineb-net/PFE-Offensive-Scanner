name: "AD Offensive Platform - Choix du Scan"

on:
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type de scan à réaliser'
        required: true
        default: 'anonyme'
        type: choice
        options:
          - anonyme
          - authentifie

jobs:
  offensive_task:
    runs-on: [self-hosted, kali]
    steps:
      - name: 1. Vérification réseau
        run: ping -c 2 192.168.159.100

      # --- SCÉNARIO A : SCAN ANONYME ---
      - name: Lancer Scan Anonyme
        if: ${{ github.event.inputs.scan_type == 'anonyme' }}
        run: |
          nmap -Pn -p 445 \
            --script smb-protocols,smb2-security-mode,smb-os-discovery \
            192.168.159.100 -oX ad_anonyme.xml
# --- SCÉNARIO B : SCAN AUTHENTIFIÉ (ENUM4LINUX-NG) ---
      - name: Lancer Scan Authentifié Profond
        if: ${{ github.event.inputs.scan_type == 'authentifie' }}
        env:
          USER: "user.std"
          PASS: ${{ secrets.AD_PASSWORD }}
          DOMAIN: "PFE"
        run: |
          # On lance le scan sans l'option d'export JSON pour valider la sortie
          # -A : Tous les tests
          # On redirige la sortie texte vers un fichier pour ne pas la perdre
          enum4linux-ng -u "$USER" -p "$PASS" -w "$DOMAIN" -A 192.168.159.100 | tee rapport_ad.txt

      - name: Upload Rapport Texte
        uses: actions/upload-artifact@v4
        with:
          name: Rapport-AD-Debug
          path: rapport_ad.txt
