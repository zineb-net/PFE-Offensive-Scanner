name: "AD Offensive Module - Authenticated Enum"

on:
  workflow_dispatch: # Bouton "Run workflow" sur GitHub

jobs:
  reconnaissance:
    # Utilisation de ton runner Kali local
    runs-on: [self-hosted, kali]
    
    steps:
      - name: 1. Vérification réseau
        run: ping -c 3 192.168.159.100

      - name: 2. Énumération Authentifiée AD (Users & Shares)
        env:
          # On appelle les secrets que tu viens de créer
          USER: ${{ secrets.AD_USER }}
          PASS: ${{ secrets.AD_PASSWORD }}
        run: |
          # Commande Nmap optimisée
          # smb-enum-users : va extraire tes 3 utilisateurs
          # smb-enum-shares : va lister les dossiers partagés
          # smb-os-discovery : va donner le nom DNS du domaine
          
          nmap -Pn -p 445 \
            --script smb-enum-users,smb-enum-shares,smb-os-discovery \
            --script-args "smbuser=$USER,smbpass=$PASS" \
            192.168.159.100 -oX ad_report.xml

      - name: 3. Archivage du rapport final
        uses: actions/upload-artifact@v4
        with:
          name: Rapport-AD-Complet
          path: ad_report.xml
