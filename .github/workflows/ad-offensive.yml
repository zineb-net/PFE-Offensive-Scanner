name: "AD Offensive Platform - Choix du Scan"

on:
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type de scan à réaliser'
        required: true
        default: 'anonyme'
        type: choice
        options:
          - anonyme
          - authentifie

jobs:
  offensive_task:
    runs-on: [self-hosted, kali]
    steps:
      - name: 1. Vérification réseau
        run: ping -c 2 192.168.159.100

      # --- SCÉNARIO A : SCAN ANONYME ---
      - name: Lancer Scan Anonyme
        if: ${{ github.event.inputs.scan_type == 'anonyme' }}
        run: |
          nmap -Pn -p 445 \
            --script smb-protocols,smb2-security-mode,smb-os-discovery \
            192.168.159.100 -oX ad_anonyme.xml
# --- SCÉNARIO B : SCAN AUTHENTIFIÉ (ENUM4LINUX-NG CORRIGÉ) ---
      - name: Lancer Scan Authentifié Profond
        if: ${{ github.event.inputs.scan_type == 'authentifie' }}
        env:
          USER: "user.std"
          PASS: ${{ secrets.AD_PASSWORD }}
          DOMAIN: "PFE"
        run: |
          # Utilisation de -w pour le domaine et placement de l'IP à la fin
          enum4linux-ng -u "$USER" -p "$PASS" -w "$DOMAIN" -A 192.168.159.100 -oJ rapport_ad.json

      - name: Upload Rapport JSON
        uses: actions/upload-artifact@v4
        with:
          name: Rapport-AD-JSON
          path: rapport_ad.json
