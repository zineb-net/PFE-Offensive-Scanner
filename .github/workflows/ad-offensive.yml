name: "AD Offensive Platform - Choix du Scan"

on:
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Stratégie de scan à lancer'
        required: true
        default: 'anonyme'
        type: choice
        options:
          - anonyme
          - authentifie
      target_ip:
        description: 'IP cible (ex: 192.168.159.100)'
        required: true
        default: '192.168.159.100'
      username:
        description: 'Nom d utilisateur (pour scan authentifié)'
        required: false
        default: ''
      password:
        description: 'Mot de passe (pour scan authentifié)'
        required: false
        default: ''

jobs:
  offensive_task:
    runs-on: [self-hosted, kali]
    steps:
      - name: 1. Vérification réseau
        run: ping -c 2 ${{ github.event.inputs.target_ip }}

      # --- SCÉNARIO A : SCAN ANONYME ---
      - name: Lancer Scan Anonyme (Enum4linux-ng)
        if: ${{ github.event.inputs.scan_type == 'anonyme' }}
        run: |
          echo "🚀 Lancement du scan anonyme sur ${{ github.event.inputs.target_ip }}"
          # -j pour le JSON, || echo pour garantir qu'un fichier existe même en cas d'erreur
          enum4linux-ng -A ${{ github.event.inputs.target_ip }} -j ad_report.json || echo "{\"status\": \"error\", \"msg\": \"Echec scan anonyme\"}" > ad_report.json

      # --- SCÉNARIO B : SCAN AUTHENTIFIÉ ---
      - name: Lancer Scan Authentifié (Enum4linux-ng)
        if: ${{ github.event.inputs.scan_type == 'authentifie' }}
        run: |
          # Utilisation de guillemets simples pour protéger les caractères spéciaux
          USER='${{ github.event.inputs.username }}'
          PASS='${{ github.event.inputs.password }}'
          IP='${{ github.event.inputs.target_ip }}'
          DOMAIN='PFE'

          if [ -z "$USER" ]; then USER="support.it"; fi

          echo "🔥 Tentative d'authentification sur $IP avec l'utilisateur $USER"

          # Ajout de -v (verbose) pour le debug et redirection des erreurs (2>&1)
          # On tente de générer le JSON. Si ça échoue, on écrit l'erreur dans le fichier.
          enum4linux-ng -u "$USER" -p "$PASS" -w "$DOMAIN" -A "$IP" -j ad_report.json -v 2>&1 || echo "{\"error\": \"Echec authentification ou accès refusé\"}" > ad_report.json
          
          # --- DEBUG ---
          echo "Vérification du contenu du rapport généré :"
          cat ad_report.json

      - name: Archivage du rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-ad
          path: ad_report.json
