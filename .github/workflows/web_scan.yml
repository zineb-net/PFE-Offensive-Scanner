name: "Plateforme Offensive Web - Multi-Niveaux"

on:
  repository_dispatch:
    types: [web_scan_event]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # --- ÉTAPE 1 : QUICK SCAN (NUCLEI V3) ---
      # Cette étape génère le fichier JSON indispensable pour DefectDojo
      - name: Quick Scan - Nuclei
        uses: projectdiscovery/nuclei-action@v3
        with:
          urls: ${{ github.event.client_payload.url }}
          args: "-json -o nuclei_results.json"

      # --- ÉTAPE 2 : SCAN APPROFONDI (OWASP ZAP) ---
      # Ne s'exécute que si le mode 'approf' est envoyé par ton FastAPI
      - name: Deep Scan - OWASP ZAP
        if: ${{ github.event.client_payload.mode == 'approf' }}
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: ${{ github.event.client_payload.url }}
          cmd_options: '-J report_zap.json'

      # --- ÉTAPE 3 : ARCHIVAGE DES RÉSULTATS ---
      # On crée un dossier ZIP contenant les rapports pour les télécharger
      - name: Archive des Rapports
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.mode == 'approf' && 'Rapport-Complet' || 'Rapport-Quick' }}
          path: |
            nuclei_results.json
            report_zap.json
          # if-no-files-found: warn permet de ne pas faire échouer le job si ZAP n'a pas tourné
          if-no-files-found: warn
