name: Web Security Scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL de la cible à scanner'
        required: true
        default: 'http://example.com'
      scan_mode:
        description: 'Mode de scan (quick ou approf)'
        required: true
        default: 'quick'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Tes étapes de scan (Nuclei, ZAP, etc.) ici...
      - name: Run Scan
        run: |
          echo "Scanning target: ${{ github.event.inputs.target_url }}"
          echo "Mode: ${{ github.event.inputs.scan_mode }}"
