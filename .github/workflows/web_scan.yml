name: Web Security Scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL de la cible à scanner'
        required: true
      scan_mode:
        description: 'Mode (quick ou approf)'
        required: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nuclei
        run: |
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Run Nuclei Scan
        # Correction CRITIQUE : on utilise -jsonl au lieu de -json
        run: |
          nuclei -u ${{ github.event.inputs.target_url }} -jsonl -o nuclei_results.json -ni
        continue-on-error: true

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ github.event.inputs.target_url }}
          artifact_name: 'zap_report'
        continue-on-error: true

      - name: Upload Scan Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-results
          path: |
            nuclei_results.json
            report_zap.json
            *.json
